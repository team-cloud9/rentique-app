<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rentique - Business Login</title>
  <link rel="stylesheet" href="../styles/main.css">
  <script src="../js/pages/login.js" type="module" defer></script>
</head>
<body>
  <div class="container">
    <div class="left">
      <div class="logo-section">
        <a href="index.html" class="back-arrow">←</a>
        <img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/logo-4eh45c3WUpYmwPpP2HPt2jStjtt4Gt.png" alt="Rentique logo" class="logo">
        <h1>RENTIQUE</h1>
      </div>

      <form class="login-form" id="loginForm">
        <h2>LOG IN</h2>
        
        <div class="form-group">
          <input type="email" id="email" placeholder="Email" required>
          <span class="error-message" id="emailError"></span>
        </div>

        <div class="form-group">
          <input type="password" id="password" placeholder="Password" required>
          <span class="error-message" id="passwordError"></span>
        </div>

        <!-- Updated forgot password link structure -->
        <div style="margin-top: -10px;">
          <span class="forgot">Forgot your password?</span>
          <a href="forgot-password.html" class="forgot forgot-reset">Reset Password</a>
        </div>

        <button type="submit" class="login-btn">LOG IN</button>

        <p class="signup-text">
          Don't have an account? <a href="signup-business.html">Sign Up</a>
        </p>

        <!-- Added customer login link -->
        <p class="customer-link">
          Sign in as <a href="login-customer.html">Customer</a>
        </p>
      </form>
    </div>

    <div class="right">
      <img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/4%207-rJBy0McPzMNB6dEuOxmkpBxrCWJrOB.png" alt="Fashion Model" class="hero-img">
    </div>
  </div>

  <div id="modalContainer" class="modal-container">
    <div class="modal-box">
        <h3 id="modalTitle" class="modal-title"></h3>
        <p id="modalMessage" class="modal-message"></p>
        <div id="modalInputContainer" class="modal-input-container">
            <input type="password" id="modalInput" class="modal-input">
        </div>
        <div id="modalButtonContainer" class="modal-button-container">
        </div>
    </div>
  </div>
</body>
</html>
