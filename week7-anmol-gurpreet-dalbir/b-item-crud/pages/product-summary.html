<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Detail - Rentique</title>
    <link rel="stylesheet" href="../styles/product-summary.css">
    <link rel="stylesheet" href="../styles/business-add-item.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="../js/pages/product-summary.js" type="module" defer></script>
</head>
<body>

    <header class="summ-header">
        <div class="summ-header__content">
            <a href="business-add-item.html" class="summ-header__back-btn"><i class='bx bx-chevron-left'></i></a>
            <div class="summ-header__logo">RENTIQUE</div>
            <nav class="summ-header__nav">
                <a href="#">BROWSE</a><a href="#">CHAT LIST</a><a href="#">PROFILE</a>
            </nav>
            <div class="summ-header__user">Hi, Rentee</div>
        </div>
        <h1 class="summ-header__title">ITEM'S DETAIL</h1>
    </header>

    <section class="summ-gallery" id="galleryContainer">
    </section>
 
    <section class="summ-details">
        
        <div class="summ-details__header">
            <h2 id="dispItemName" class="summ-details__title"></h2>
            <span id="dispItemPrice" class="summ-details__price"></span>
        </div>

        <p id="dispItemDesc" class="summ-details__description"></p>
        <p class="summ-details__source">A product from <strong>Rentique Boutique</strong></p>

      

        <div class="summ-attr-group">
            <h3 class="summ-attr-group__title">Color:</h3>
            <div id="dispColors" class="summ-tags-container"></div>
        </div>
        <div class="summ-attr-group">
            <h3 class="summ-attr-group__title">Size:</h3>
            <div id="dispSizes" class="summ-tags-container"></div>
        </div>
        <div class="summ-attr-group">
            <h3 class="summ-attr-group__title">Size Fit:</h3>
            <div id="dispSizeFit" class="summ-tags-container"></div>
        </div>
        <div class="summ-attr-group">
            <h3 class="summ-attr-group__title">Category & Gender:</h3>
            <div id="dispCatGender" class="summ-tags-container"></div>
        </div>
        <div class="summ-attr-group">
            <h3 class="summ-attr-group__title">Material:</h3>
            <div id="dispMaterial" class="summ-tags-container"></div>
        </div>
        <div class="summ-attr-group">
            <h3 class="summ-attr-group__title">Texture:</h3>
            <div id="dispTexture" class="summ-tags-container"></div>
        </div>
        <div class="summ-attr-group">
            <h3 class="summ-attr-group__title">Style:</h3>
            <div id="dispStyle" class="summ-tags-container"></div>
        </div>
        <div class="summ-attr-group" id="sizeChartContainer" style="display:none;">
            <h3 class="summ-attr-group__title">Size Chart</h3>
            <img id="dispSizeChart" src="/placeholder.svg" alt="Size Chart" class="summ-details__chart-img">
        </div>

        <div class="summ-action-buttons">
            <button id="editItemBtn" class="summ-action-btn summ-action-btn--edit">
                <i class='bx bx-edit-alt'></i>
                Edit
            </button>
            <button id="deleteItemBtn" class="summ-action-btn summ-action-btn--delete">
                <i class='bx bx-trash'></i>
                Delete
            </button>
        </div>

    </section>
   
    <header class="summ-mobile-header">
        <div class="summ-mobile-header__content">
            <a href="business-add-item.html" class="summ-mobile-header__icon-link">
                <img src="../assets/icons/browse.svg" alt="Browse" class="summ-mobile-header__icon">
            </a>
            <a href="business-add-item.html" class="summ-mobile-header__logo-link">
                <img src="../assets/images/mobile-logo.svg" alt="Rentique" class="summ-mobile-header__logo">
            </a>
            <div class="summ-mobile-header__right">
                <a href="business-add-item.html" class="summ-mobile-header__icon-link">
                    <img src="../assets/icons/chats.svg" alt="Chats" class="summ-mobile-header__icon">
                </a>
                <a href="business-add-item.html" class="summ-mobile-header__icon-link">
                    <img src="../assets/icons/business-profile.svg" alt="Profile" class="summ-mobile-header__icon">
                </a>
            </div>
        </div>
        <h1 class="summ-mobile-header__title">ITEM'S DETAIL</h1>
    </header>

    <footer class="b-add-footer">
        <div class="b-add-footer__content">
            <div class="b-add-footer__column b-add-footer__column--about">
                <div class="b-add-footer__logo-container">
                    <img src="../assets/images/logo_rentique.svg" alt="Rentique Logo" class="b-add-footer__logo">
                    <img src="../assets/images/mobile-logo.svg" alt="Rentique Logo" class="b-add-footer__logo b-add-footer__logo--mobile">
                    <span class="b-add-footer__logo-text">RENTIQUE</span>
                </div>
                <p class="b-add-footer__description">Our boutique is for rent</p>
            </div>
            <div class="b-add-footer__column">
                <h4 class="b-add-footer__heading">SEARCH</h4>
            </div>
            <div class="b-add-footer__column">
                <h4 class="b-add-footer__heading">CHAT LIST</h4>
            </div>
            <div class="b-add-footer__column">
                <h4 class="b-add-footer__heading">PROFILE</h4>
            </div>
        </div>
        <div class="b-add-footer__copyright">
            <p>© 2025 CloudTeam. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
