<div id="sortModal" class="sort-modal">
  <div class="sort-modal-content">
    <div class="sort-options">
      <label class="sort-option">
        <input type="radio" name="sort" value="recent" checked>
        <span class="radio-custom"></span>
        <span class="sort-label">Recently added</span>
      </label>
      <label class="sort-option">
        <input type="radio" name="sort" value="high-to-low">
        <span class="radio-custom"></span>
        <span class="sort-label">$ High to Low</span>
      </label>
      <label class="sort-option">
        <input type="radio" name="sort" value="low-to-high">
        <span class="radio-custom"></span>
        <span class="sort-label">$ Low to High</span>
      </label>
    </div>
  </div>
</div>
