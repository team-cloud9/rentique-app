<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Rentique · Brand Profile</title>

    <meta name="theme-color" content="#06324f">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/assets/logos/rentique-sub.png">

    <link rel="stylesheet" href="../../components/css/var.css" />
    <link rel="stylesheet" href="../../components/css/modal.css" />
    <link rel="stylesheet" href="../../components/css/header-footer.css" />
    <link rel="stylesheet" href="../css/b-profile.css" />
    <script src="../../../controller/components/modal.js"  type = "module" defer></script>
    <script src="../../../controller/business-side/b-profile.js" type="module" defer></script>
    <script src="../../../controller/components/components.js" type="module" defer></script>
</head>
<body>
    

    <div id="header-placeholder" data-user-type="business"></div>

    <main>
        <section class="brand-profile">
            <div class="brand-form">            
              <h2 class="brand-profile__title" >BRAND PROFILE</h2>
            <div class="brand-form__fields">
                <label for="brandName">Brand name</label>
                <input type="text" id="brandName" placeholder="Enter brand name">

                <label for="address">Address</label>
                <input type="text" id="address" placeholder="Enter address">

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter email">
            </div>
            <button class="save-btn">SAVE</button>
        </div>
        <div class="brand-profile__image-upload" id="uploadBox">+</div>
        </section>
    </main>


    <div id="footer-placeholder" data-user-type="business"></div>

</body>
</html>
