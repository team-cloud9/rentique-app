<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rentique - Forgot Password</title>
  <link rel="stylesheet" href="../css/auth.css">
  <script src="../../../controller/business-side/auth-forgot-password.js" type="module" defer></script>
</head>
<body>
  <div class="container">
    <div class="left">
      <div class="logo-section">
        <a href="auth-login-business.html" class="back-arrow">←</a>
        <img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/logo-4eh45c3WUpYmwPpP2HPt2jStjtt4Gt.png" alt="Rentique logo" class="logo">
        <h1>RENTIQUE</h1>
      </div>

      <form class="login-form" id="forgotPasswordForm">
        <h2>PASSWORD RESET</h2>
        
        <div class="form-group">
          <input type="email" id="email" placeholder="Email" required>
          <span class="error-message" id="emailError"></span>
        </div>

        <button type="submit" class="login-btn">SEND RESET REQUEST</button>

        <p class="signup-text">
          Return to <a href="auth-login-business.html">Log In</a>
        </p>
      </form>
    </div>

    <div class="right">
      <img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/4%207-rJBy0McPzMNB6dEuOxmkpBxrCWJrOB.png" alt="Fashion Model" class="hero-img">
    </div>
  </div>

  <div id="modalContainer" class="modal-container">
    <div class="modal-box">
        <h3 id="modalTitle" class="modal-title"></h3>
        <p id="modalMessage" class="modal-message"></p>
        <div id="modalInputContainer" class="modal-input-container">
            <input type="password" id="modalInput" class="modal-input">
        </div>
        <div id="modalButtonContainer" class="modal-button-container">
        </div>
    </div>
  </div>
</body>
</html>
