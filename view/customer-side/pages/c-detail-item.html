<!-- Revised by Rika -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Item Detail - Rentique</title>

    <meta name="theme-color" content="#06324f" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/assets/logos/rentique-sub.png" />

    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/c-detail-item.css" />
    <link rel="stylesheet" href="/view/components/css/var.css" />
    <link rel="stylesheet" href="/view/components/css/header-footer.css" />
    <script
      src="../../../controller/components/components.js"
      type="module"
      defer
    ></script>
    <script
      src="../../../controller/customer-side/c-detail-item.js"
      type="module"
      defer
    ></script>
    <link rel="stylesheet" href="/view/components/css/modal.css" />
    <script src="../../../controller/components/modal.js" defer></script>
  </head>

  <body>
    <div id="header-placeholder" data-user-type="business"></div>
    <div class="item-detail-container">
      <h2 class="items-detail-title">ITEM'S DETAIL</h2>

      <section class="summ-gallery" id="galleryContainer">
        <div class="summ-gallery__slider-wrapper"></div>
        <button class="summ-gallery__arrow prev" aria-label="Previous image">
          &lt;
        </button>
        <button class="summ-gallery__arrow next" aria-label="Next image">
          &gt;
        </button>
        <div class="summ-gallery__dots"></div>
      </section>

      <section class="summ-location" id="location-info">
        <a
          id="directions-link"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            id="location-map"
            src=""
            alt="Map showing business location"
            style="display: none"
          />
        </a>
        <p id="distance-text" class="summ-details__description"></p>
        <button
          id="use-current-location-btn"
          class="summ-action-btn summ-action-btn--secondary"
          style="display: none"
        >
          Use Current Location
        </button>
      </section>

      <section class="summ-details">
        <div class="summ-details__header">
          <h2 id="dispItemName" class="summ-details__title"></h2>
          <span id="dispItemPrice" class="summ-details__price"></span>
        </div>

        <p id="dispItemDesc" class="summ-details__description"></p>
        <p class="summ-details__source">
          By <strong id="dispBusinessName"></strong>
        </p>

        <!-- Color -->
        <div class="summ-attr-group summ-attr-group--color">
          <h3 class="summ-attr-group__title">Color</h3>
          <div id="dispColors" class="summ-tags-container"></div>
        </div>

        <!-- Size -->
        <div class="summ-attr-group summ-attr-group--size">
          <h3 class="summ-attr-group__title">Size</h3>
          <div id="dispSizes" class="summ-tags-container"></div>
        </div>

        <!-- Size Fit -->
        <div class="summ-attr-group summ-attr-group--sizefit" data-dropdown>
          <h3 class="summ-attr-group__title" onclick="toggleDropdown(this)">
            Size Fit
            <span class="dropdown-arrow">
              <img
                src="../../../assets/icons/Icon_dropdown.svg"
                alt="dropdown"
              />
            </span>
          </h3>
          <div id="dispSizeFit" class="summ-tags-container"></div>
        </div>

        <!-- Category -->
        <div class="summ-attr-group summ-attr-group--category" data-dropdown>
          <h3 class="summ-attr-group__title" onclick="toggleDropdown(this)">
            Category
            <span class="dropdown-arrow">
              <img
                src="../../../assets/icons/Icon_dropdown.svg"
                alt="dropdown"
              />
            </span>
          </h3>
          <div id="dispCategory" class="summ-tags-container"></div>
        </div>

        <!-- Gender -->
        <div class="summ-attr-group summ-attr-group--gender">
          <h3 class="summ-attr-group__title">Gender</h3>
          <div id="dispGender" class="summ-tags-container"></div>
        </div>

        <!-- Material -->
        <div class="summ-attr-group summ-attr-group--material" data-dropdown>
          <h3 class="summ-attr-group__title" onclick="toggleDropdown(this)">
            Material
            <span class="dropdown-arrow">
              <img
                src="../../../assets/icons/Icon_dropdown.svg"
                alt="dropdown"
              />
            </span>
          </h3>
          <div id="dispMaterial" class="summ-tags-container"></div>
        </div>

        <!-- Texture -->
        <div class="summ-attr-group summ-attr-group--texture" data-dropdown>
          <h3 class="summ-attr-group__title" onclick="toggleDropdown(this)">
            Texture
            <span class="dropdown-arrow">
              <img
                src="../../../assets/icons/Icon_dropdown.svg"
                alt="dropdown"
              />
            </span>
          </h3>
          <div id="dispTexture" class="summ-tags-container"></div>
        </div>

        <!-- Season -->
        <div class="summ-attr-group summ-attr-group--season" data-dropdown>
          <h3 class="summ-attr-group__title" onclick="toggleDropdown(this)">
            Recommend Season
            <span class="dropdown-arrow">
              <img
                src="../../../assets/icons/Icon_dropdown.svg"
                alt="dropdown"
              />
            </span>
          </h3>
          <div id="dispSeason" class="summ-tags-container"></div>
        </div>

        <!-- Style -->
        <div class="summ-attr-group summ-attr-group--style" data-dropdown>
          <h3 class="summ-attr-group__title" onclick="toggleDropdown(this)">
            Style
            <span class="dropdown-arrow">
              <img
                src="../../../assets/icons/Icon_dropdown.svg"
                alt="dropdown"
              />
            </span>
          </h3>
          <div id="dispStyle" class="summ-tags-container"></div>
        </div>

        <!-- Size Chart -->
        <div
          class="summ-attr-group summ-attr-group--chart"
          id="sizeChartContainer"
          style="display: none"
        >
          <h3 class="summ-attr-group__title">Size Chart</h3>
          <a href="#sizechart-viewer">
            <img
              id="dispSizeChart"
              src="/placeholder.svg"
              alt="Size Chart"
              class="summ-details__chart-img"
            />
          </a>
        </div>
      </section>

      <div class="summ-action-buttons">
        <button
          id="chatWithOwnerBtn"
          class="summ-action-btn summ-action-btn--chat"
        >
          CHAT WITH OWNER
        </button>
      </div>

      <!-- size chart popup -->
      <div id="sizechart-viewer" class="img-viewer">
        <a href="#" class="img-viewer__overlay"></a>
        <img id="sizechart-viewer-img" src="" class="img-viewer__content" />
      </div>
    </div>
    <div id="footer-placeholder" data-user-type="business"></div>
  </body>
</html>
