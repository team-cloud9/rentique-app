<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Style Shuffle</title>

  <!-- /Component -->
  <link rel="stylesheet" href="../components/view/css/var.css" />
  <link rel="stylesheet" href="../components/view/css/header-footer.css" />
  <script src="../components/controller/components.js" defer></script>
  <script src="../components/controller/component-loader.js" defer></script>

  <!-- Component/ -->

  <link rel="stylesheet" href="../c-css/c-style.css" />
  <link rel="stylesheet" href="../components/view/css/var.css" />

  <!-- Page Specific Style -->

  <style>
    .container {
      width: 100%;
      max-width: 1200px;
      padding: 3rem;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ========== Overall Section ========== */
    .edit-profile-section {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      padding: 2rem 4rem;
      color: var(--deep-teal-blue);
    }

    .edit-profile-section h2 {
      font-size: 1.1rem;
      color: var(--deep-teal-blue);
      margin-bottom: 1rem;
    }

    /* ========== Layout ========== */
    .edit-content {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 2rem;
    }

    /* ========== Form (Left Side) ========== */
    .edit-form {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      flex: 1;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      width: 500px;
    }

    .edit-form label {
      font-size: 0.85rem;
      color: var(--teal-blue-400);
      margin-bottom: 0.3rem;
    }

    .edit-form input {
      border: none;
      border-bottom: 1px solid var(--gray-300);
      padding: 0.4rem 0;
      font-size: 1rem;
      color: var(--teal-blue-400);
    }

    .edit-form input:focus {
      outline: none;
      border-color: var(--gray-500);
    }

    /* ========== Update Button ========== */
    .update-btn-container {
      display: flex;
      justify-content: center;
    }

    .update-btn {
      background-color: var(--gray-300);
      color: var(--nyanza-200);
      border: none;
      border-radius: 3px;
      padding: 1rem 10rem;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .update-btn:hover {
      background-color: var(--nyanza-200);
      color: var(--gray-400);
    }

    /* ========== Profile Image ========== */
    .profile-image {
      position: relative;
      width: 300px;
      height: 400px;
      flex-shrink: 0;
      border: 1px solid var(--gray-300);
    }

    .profile-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
    }

    .remove-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--nyanza-200);
      border: 1px solid var(--gray-300);
      color: var(--deep-teal-blue);
      border-radius: 50%;
      width: 24px;
      height: 24px;
      line-height: 18px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .remove-btn:hover {
      background-color: var(--deep-teal-blue);
      color: var(--nyanza-200);
    }

    /* ========== Responsive ========== */
  </style>

</head>

<body>
  <!-- Header -->
  <div id="header-placeholder" data-user-type="customer"></div>

  <!-- Main Content -->
  <main class="container">
    <section class="edit-profile-section">
      <h2>EDIT PROFILE</h2>

      <div class="edit-content">
        <form class="edit-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" readonly />
          </div>

          <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" readonly />
          </div>
        </form>

        <div class="profile-image">
          <img id="profile-photo" alt="Profile Photo" />
          <button class="remove-btn">×</button>
        </div>
      </div>

      <div class="update-btn-container">
        <button type="button" class="update-btn">UPDATE</button>
      </div>
    </section>

    <script type="module">
      import { db } from "../../controller/firebase-config.js";
      import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

      async function loadUserProfile() {
        try {
          // EXAMPLE
          const userId = "chloe123";
          const userRef = doc(db, "users", userId);
          const userSnap = await getDoc(userRef);

          if (userSnap.exists()) {
            const userData = userSnap.data();
            document.getElementById("username").value = userData.username || "";
            document.getElementById("address").value = userData.address || "";
            document.getElementById("profile-photo").src =
              userData.photoURL ||
              "https://placehold.co/200x200?text=No+Photo";
          } else {
            console.log("❌ No user data found.");
          }
        } catch (err) {
          console.error("Error loading profile:", err);
        }
      }

      loadUserProfile();
    </script>
</body>

</html>
