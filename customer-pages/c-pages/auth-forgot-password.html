<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rentique - Forgot Password</title>

    <meta name="theme-color" content="#06324f" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/assets/logos/rentique-sub.png" />

    <!-- Styles -->
    <link rel="stylesheet" href="../c-styles/customer-auth.css" />

    <!-- Customer-side JS (Firebase version) -->
    <script
      type="module"
      src="../c-js/c-pages/auth-forgot-password.js"
      defer
    ></script>
  </head>

  <body>
    <div class="container">
      <!-- Left Panel -->
      <div class="left">
        <div class="logo-section">
          <a href="auth-login-customer.html" class="back-arrow">←</a>
          <img
            src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/logo-4eh45c3WUpYmwPpP2HPt2jStjtt4Gt.png"
            alt="Rentique logo"
            class="logo"
          />
          <h1>RENTIQUE</h1>
        </div>

        <!-- Forgot Password Form -->
        <form class="login-form" id="forgotPasswordForm">
          <h2>PASSWORD RESET</h2>
          <p class="form-subtext">
            Enter your registered email and we’ll send a reset link.
          </p>

          <div class="form-group">
            <input type="email" id="email" placeholder="Email" required />
            <span class="error-message" id="emailError"></span>
          </div>

          <button type="submit" class="login-btn">SEND RESET REQUEST</button>

          <p class="signup-text">
            Return to <a href="auth-login-customer.html">Log In</a>
          </p>
        </form>
      </div>

      <!-- Right Panel -->
      <div class="right">
        <img
          src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/4%207-rJBy0McPzMNB6dEuOxmkpBxrCWJrOB.png"
          alt="Fashion Model"
          class="hero-img"
        />
      </div>
    </div>

    <!-- Modal Container (optional placeholder for future use) -->
    <div id="modalContainer" class="modal-container" style="display: none">
      <div class="modal-box">
        <h3 id="modalTitle" class="modal-title"></h3>
        <p id="modalMessage" class="modal-message"></p>
        <div id="modalInputContainer" class="modal-input-container">
          <input type="password" id="modalInput" class="modal-input" />
        </div>
        <div id="modalButtonContainer" class="modal-button-container"></div>
      </div>
    </div>
  </body>
</html>
