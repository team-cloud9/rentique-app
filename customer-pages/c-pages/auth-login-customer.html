<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rentique - Customer Login</title>
    <link rel="stylesheet" href="../c-styles/customer-auth.css" />
    <script
      type="module"
      src="../c-js/c-pages/auth-login-customer.js"
      defer
    ></script>
  </head>

  <body>
    <div class="container">
      <div class="left">
        <!-- Logo Section -->
        <div class="logo-section">
          <a href="auth-welcome.html" class="back-arrow">←</a>
          <img
            src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/logo-4eh45c3WUpYmwPpP2HPt2jStjtt4Gt.png"
            alt="Rentique logo"
            class="logo"
          />
          <h1>RENTIQUE</h1>
        </div>

        <!-- Login Form -->
        <form class="login-form" id="loginForm">
          <h2>LOG IN</h2>

          <div class="form-group">
            <input type="email" id="email" placeholder="Email" required />
            <span class="error-message" id="emailError"></span>
          </div>

          <div class="form-group">
            <input
              type="password"
              id="password"
              placeholder="Password"
              required
            />
            <span class="error-message" id="passwordError"></span>
          </div>

          <button type="submit" class="login-btn auth-btn">LOG IN</button>

          <a href="auth-forgot-password.html" class="forgot"
            >Forgot password?</a
          >

          <p class="signup-text">
            Don’t have an account?
            <a href="auth-signup-customer.html">Sign Up</a>
          </p>
        </form>
      </div>

      <div class="right">
        <img
          src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/4%207-rJBy0McPzMNB6dEuOxmkpBxrCWJrOB.png"
          alt="Fashion Model"
          class="hero-img"
        />
      </div>
    </div>
  </body>
</html>
