<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Style Shuffle</title>

  <!-- /Component -->
  <link rel="stylesheet" href="../components/view/css/var.css" />
  <link rel="stylesheet" href="../components/view/css/header-footer.css" />
  <script src="../components/controller/components.js" defer></script>
  <script src="../components/controller/component-loader.js" defer></script>
  <!-- Component/ -->

  <!-- <link rel="stylesheet" href="../c-styles/c-style.css" /> -->
  <link rel="stylesheet" href="../c-styles/global-styles.css" />
  <link rel="stylesheet" href="../c-styles/customer-filter-sort.css" />
  <link rel="stylesheet" href="../components/view/css/var.css" />
  <script src="../c-js/services/ProductData.js" defer></script>
  <script src="../c-js/c-pages/discover-popup.js" defer></script>
  <script src="../c-js/c-pages/discover-main.js" defer></script>


</head>

<body>
  <!-- Header -->
  <div id="header-placeholder" data-user-type="customer"></div>

  <!-- Main -->
  <main class="container">

    <!-- Swipe Your Style Section -->
    <section class="swipe-style">
      <h2>SWIPE YOUR STYLE</h2>
      <p>Discover your style in every swipe</p>

      <div class="swipe-container">
        <button class="arrow left">
          <img src="../assets/icon/Icon_dropdown.svg" alt="previous" />
        </button>

        <div class="swipe-items">
          <!-- render here -->
        </div>

        <button class="arrow right">
          <img src="../assets/icon/Icon_dropdown.svg" alt="next" />
        </button>
      </div>
    </section>

    <!-- Popup for Swipe Item -->
    <div class="popup-container" id="swipePopup">
      <div class="popup-content swipe">
        <span class="close-popup" id="closePopup">&times;</span>
        <div class="swipe-popup-body">
          <div class="swipe-popup-left">
            <img src="" alt="Recommended Item" id="popupImage" />
          </div>
          <div class="swipe-popup-right">
            <h3>RECOMMEND FOR YOU!</h3>
            <h2 class="swipe-popup-title"></h2>
            <p class="swipe-label">
              Brand: <span id="swipePopupBrand"></span>
            </p>
            <p class="swipe-label">
              Description:
              <span id="swipePopupDesc"></span>
            </p>
            <div class="swipe-popup-details"></div>
          </div>
        </div>
        <div class="swipe-popup-buttons">
          <button class="swipe-btn-pass">PASS</button>
          <button class="swipe-btn-like">LIKE</button>
        </div>
      </div>
    </div>

    <!-- Item List Section -->
    <section class="item-list">
      <h2>ITEM LISTS</h2>
      <!-- Filter/Sort Section -->
      <section class="filter-sort">
        <button id="filterBtn">Filter</button>
        <div class="dropdown">
          <button class="dropdown-btn sort-btn">Sort</button>
          <div class="dropdown-menu">
            <label><input type="radio" name="sort" value="recommended" checked /><span>Recently Added</span></label>
            <label><input type="radio" name="sort" value="price-high" /><span>$High to Low</span></label>
            <label><input type="radio" name="sort" value="price-low" /><span>$Low to High</span></label>
          </div>
        </div>
      </section>

      <!-- Filter Popup (Initially hidden) -->
      <div class="popup-container" id="filterPopup">
        <div class="popup-content">
          <div class="filter-header">
            <div class="dropdown">
              <button class="dropdown-btn">Filter</button>
            </div>
          </div>

          <span class="close-popup" id="closePopup">&times;</span>

          <!-- Category -->
          <div class="filter-section">
            <h3>Category</h3>
            <div class="filter-options">
              <button class="filter-btn">T-shirts</button>
              <button class="filter-btn">Blouses & Shirts</button>
              <button class="filter-btn">Sweaters</button>
              <button class="filter-btn">Hoodies</button>
              <button class="filter-btn">Pants & Trousers </button>
              <button class="filter-btn">Jeans</button>
              <button class="filter-btn">Shorts</button>
              <button class="filter-btn">Skirts</button>
              <button class="filter-btn">Dresses</button>
              <button class="filter-btn">Jumpsuits </button>
              <button class="filter-btn">Rompers </button>
              <button class="filter-btn">Outerwear </button>
              <button class="filter-btn">Blazers </button>
              <button class="filter-btn">Suits </button>
            </div>
          </div>

          <!-- Size -->
          <div class="filter-section">
            <h3>Size</h3>
            <div class="filter-options">
              <button class="filter-btn">XXS</button>
              <button class="filter-btn">XS</button>
              <button class="filter-btn">S</button>
              <button class="filter-btn">M</button>
              <button class="filter-btn">L</button>
              <button class="filter-btn">XL</button>
              <button class="filter-btn">XXL</button>
            </div>
          </div>

          <!-- Price Range -->
          <div class="filter-section">
            <h3>Price Range</h3>
            <div class="range-container">
              <div class="range-labels">
                <span>$1</span>
                <span>$120</span>
              </div>
              <input type="range" min="10" max="120" value="65" id="priceRange" />
            </div>
          </div>

          <!-- Distance -->
          <div class="filter-section">
            <h3>Distance</h3>
            <div class="range-container">
              <div class="range-labels">
                <span>0km</span>
                <span>+120km</span>
              </div>
              <input type="range" min="0" max="120" value="60" id="distanceRange" />
            </div>
          </div>

          <!-- Style -->
          <div class="filter-section">
            <h3>Style</h3>
            <div class="filter-options">
              <button class="filter-btn">Casual</button>
              <button class="filter-btn">Formal</button>
              <button class="filter-btn">Business</button>
              <button class="filter-btn">Party</button>
              <button class="filter-btn">Dressy</button>
              <button class="filter-btn">Vintage</button>
              <button class="filter-btn">Street Style</button>
              <button class="filter-btn">Minimalist</button>
              <button class="filter-btn">Sporty</button>
              <button class="filter-btn">Elegant</button>
              <button class="filter-btn">Preppy</button>
              <button class="filter-btn">Y2K</button>
            </div>
          </div>

          <!-- Material -->
          <div class="filter-section">
            <h3>Material</h3>
            <div class="filter-options">
              <button class="filter-btn">Cotton</button>
              <button class="filter-btn">Denim</button>
              <button class="filter-btn">Linen</button>
              <button class="filter-btn">Silk & Satin</button>
              <button class="filter-btn">Wool</button>
              <button class="filter-btn">Cashmere</button>
              <button class="filter-btn">Leather</button>
              <button class="filter-btn">Polyester</button>
              <button class="filter-btn">Nylon</button>
              <button class="filter-btn">Rayon</button>
              <button class="filter-btn">Velvet</button>
              <button class="filter-btn">Corduroy</button>
            </div>
          </div>

          <!-- Texture -->
          <div class="filter-section">
            <h3>Texture</h3>
            <div class="filter-options">
              <button class="filter-btn">Smooth</button>
              <button class="filter-btn">Soft</button>
              <button class="filter-btn">Textured</button>
              <button class="filter-btn">Rough</button>
              <button class="filter-btn">Sheer</button>
              <button class="filter-btn">Matte</button>
              <button class="filter-btn">Shiny</button>
              <button class="filter-btn">Smash + Tess</button>
              <button class="filter-btn">Knitted</button>
              <button class="filter-btn">Stretchy</button>
              <button class="filter-btn">Suede-like</button>
            </div>
          </div>

          <!-- Season -->
          <div class="filter-section">
            <h3>Season</h3>
            <div class="filter-options">
              <button class="filter-btn">Spring</button>
              <button class="filter-btn">Summer</button>
              <button class="filter-btn">Autumn</button>
              <button class="filter-btn">Winter</button>
            </div>
          </div>

          <!-- Colour -->
          <div class="filter-section">
            <h3>Colour</h3>
            <div class="filter-options colour-options">
              <button class="filter-btn colour black">Black</button>
              <button class="filter-btn colour white">White</button>
              <button class="filter-btn colour grey">Grey</button>
              <button class="filter-btn colour beige">Beige</button>
              <button class="filter-btn colour brown">Brown</button>
              <button class="filter-btn colour navy">Navy</button>
              <button class="filter-btn colour red">Red</button>
              <button class="filter-btn colour pink">Pink</button>
              <button class="filter-btn colour blue">Orange</button>
              <button class="filter-btn colour yellow">Yellow</button>
              <button class="filter-btn colour green">Green</button>
              <button class="filter-btn colour green">Blue</button>
              <button class="filter-btn colour purple">Purple</button>
            </div>
          </div>

          <!-- Gender -->
          <div class="filter-section">
            <h3>Gender</h3>
            <div class="filter-options">
              <button class="filter-btn">Women</button>
              <button class="filter-btn">Men</button>
              <button class="filter-btn">Unisex</button>
            </div>
          </div>
          <div class="apply">
            <button class="apply-btn">APPLY</button>
          </div>
        </div>
      </div>
      <div class="list-items">
        <!-- Cards  -->
      </div>
    </section>


  </main>
  <!-- Footer -->
  <div id="footer-placeholder" data-user-type="customer"></div>

</body>

</html>
