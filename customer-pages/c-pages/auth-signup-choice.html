<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rentique - Sign Up Choice</title>

    <!-- PWA -->
    <meta name="theme-color" content="#06324f" />
    <link rel="manifest" href="/manifest.json" />
