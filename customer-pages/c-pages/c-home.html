<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rentique Customer-Home</title>

  <!-- /Component -->
  <link rel="stylesheet" href="../components/view/css/var.css" />
  <link rel="stylesheet" href="../components/view/css/header-footer.css" />
  <script src="../components/controller/components.js" defer></script>
  <script src="../components/controller/component-loader.js" defer></script>
  <!-- Component/ -->

  <!-- <link rel="stylesheet" href="../c-styles/c-style.css" /> -->
  <link rel="stylesheet" href="../c-styles/global-styles.css" />
  <script src="../c-js/services/ProductData.js" defer></script>
  <script src="../c-js/c-pages/home-main.js" defer></script>
</head>

<body>
  <!-- Header -->
  <div id="header-placeholder" data-user-type="customer"></div>

  <!-- Main -->
  <main class="container">
    <!-- Swipe Your Style Section -->
    <section class="swipe-style">
      <h2>SWIPE YOUR STYLE</h2>
      <p>Discover your style in every swipe</p>

      <div class="swipe-container">
        <button class="arrow left">
          <img src="../assets/icon/Icon_dropdown.svg" alt="previous" />
        </button>

        <div class="swipe-items">
          <!-- render here -->
        </div>

        <button class="arrow right">
          <img src="../assets/icon/Icon_dropdown.svg" alt="next" />
        </button>
      </div>
    </section>

    <!-- Popup for Swipe Item -->
    <div class="popup-container" id="swipePopup">
      <div class="popup-content swipe">
        <span class="close-popup" id="closePopup">&times;</span>
        <div class="swipe-popup-body">
          <div class="swipe-popup-left">
            <img src="" alt="Recommended Item" id="popupImage" />
          </div>
          <div class="swipe-popup-right">
            <h3>RECOMMEND FOR YOU!</h3>
            <div class="swipe-popup-right-mobile">
              <h2 class="swipe-popup-title"></h2>
              <p class="swipe-label">
                Brand: <span id="swipePopupBrand"></span>
              </p>
              <p class="swipe-label">
                Description:
                <span id="swipePopupDesc"></span>
              </p>
              <div class="swipe-popup-details"></div>
            </div>
          </div>
        </div>
        <div class="swipe-popup-buttons">
          <button class="swipe-btn-pass">PASS</button>
          <button class="swipe-btn-like">LIKE</button>
        </div>
      </div>
    </div>

    <!-- Item List Section -->
    <section class="item-list">
      <div class="item-list-header">
        <h2>ITEM LISTS</h2>
        <div class="discoverBtn">
          <a href="./c-discover-page.html">Discover more</a>
        </div>
      </div>

      <div class="list-items">
        <!-- render here -->
      </div>
    </section>
  </main>
  <!-- Footer -->
  <div id="footer-placeholder" data-user-type="customer"></div>
</body>

</html>
