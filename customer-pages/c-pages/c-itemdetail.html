<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ItemsDetail</title>

  <!-- /Component -->
  <link rel="stylesheet" href="../components/view/css/var.css" />
  <link rel="stylesheet" href="../components/view/css/header-footer.css" />
  <script src="../components/controller/components.js" defer></script>
  <script src="../components/controller/component-loader.js" defer></script>
  <!-- Component/ -->

  <link rel="stylesheet" href="../c-css/c-style.css" />
  <link rel="stylesheet" href="../components/view/css/var.css" />
  <script src="../c-js/c-pages/itemdetail-main.js" defer></script>
</head>

<body>

  <div id="header-placeholder" data-user-type="customer"></div>

  <!-- Main Content -->
  <main>
    <div class="container">
      <h2 class="items-detail-title">ITEM'S DETAIL</h2>

      <div class="detail-layout">
        <!-- Left: Images -->
        <div class="detail-images">
          <div class="image-placeholder">
            <img src="../assets/BrownCode.jpg" alt="Browncode" />
            <button class="image-nav" onclick="nextImage()">
              <img src="../assets/icon/Icon_back.svg" alt="next">
            </button>
          </div>
          <div class="image-placeholder hidden">
            <img src="../assets/BrownCode.jpg" alt="Browncode" />
            <button class="image-nav" onclick="nextImage()">
              <img src="../assets/icon/Icon_back.svg" alt="next">
            </button>
          </div>
        </div>

        <!-- Right: Details -->
        <div class="detail-info">
          <div class="item-header">
            <div class="item-name">Knitted Cardigan</div>
            <div class="item-price">$10.00</div>
          </div>

          <p class="item-description">
            Women's Sexy Elegant Deep V-Neck Solid Brown
          </p>

          <!-- <div class="detail-section">
            <h3>A product from Lynn's Fabric</h3>
          </div> -->

          <div class="detail-section selectable">
            <h3>Color</h3>
            <div class="tag-group">
              <button class="tag-btn">
                <span class="color-circle" style="background-color: #8b7355"></span>
                Brown
              </button>
              <button class="tag-btn">
                <span class="color-circle" style="background-color: #d4c4b0"></span>
                Beige
              </button>
            </div>
          </div>

          <div class="detail-section selectable">
            <h3>Size</h3>
            <div class="tag-group">
              <button class="tag-btn">S</button>
              <button class="tag-btn">M</button>
              <button class="tag-btn">L</button>
            </div>
          </div>

          <div class="detail-section show" data-dropdown>
            <h3 onclick="toggleDropdown(this)">
              Size fit
              <span class="dropdown-arrow">
                <img src="../assets/icon/Icon_dropdown.svg" alt="dropdown">
              </span>
            </h3>
            <div class="tag-group">
              <button class="tag-btn">S</button>
              <button class="tag-btn">M</button>
              <button class="tag-btn">L</button>
            </div>
          </div>

          <div class="detail-section show" data-dropdown>
            <h3 onclick="toggleDropdown(this)">
              Recommend season
              <span class="dropdown-arrow">
                <img src="../assets/icon/Icon_dropdown.svg" alt="dropdown">
              </span>
            </h3>
            <div class="tag-group">
              <button class="tag-btn selected">Autumn</button>
              <button class="tag-btn selected">Winter</button>
            </div>
          </div>

          <div class="detail-section show" data-dropdown>
            <h3 onclick="toggleDropdown(this)">
              Material
              <span class="dropdown-arrow">
                <img src="../assets/icon/Icon_dropdown.svg" alt="dropdown">
              </span>
            </h3>
            <div class="tag-group">
              <button class="tag-btn selected">Cotton</button>
            </div>
          </div>

          <div class="detail-section show" data-dropdown>
            <h3 onclick="toggleDropdown(this)">
              Texture
              <span class="dropdown-arrow">
                <img src="../assets/icon/Icon_dropdown.svg" alt="dropdown">
              </span>
            </h3>
            <div class="tag-group">
              <button class="tag-btn selected">Soft</button>
            </div>
          </div>

          <div class="detail-section show" data-dropdown>
            <h3 onclick="toggleDropdown(this)">
              Style
              <span class="dropdown-arrow">
                <img src="../assets/icon/Icon_dropdown.svg" alt="dropdown">
              </span>
            </h3>
            <div class="tag-group">
              <button class="tag-btn selected">Casual</button>
            </div>
          </div>

          <div class="detail-section">
            <h3>Size Chart</h3>
            <div class="size-chart">
              <img src="../assets/SizeChart.png" alt="Size Chart" />
            </div>
          </div>
        </div>
      </div>
      <div class="action-buttons">
        <button class="chat-button primary">CHAT WITH OWNER</button>
        <button class="cart-button">
          <img src="../assets/icon/Icon_cart.svg" alt="Cart" />
        </button>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <div id="footer-placeholder" data-user-type="customer"></div>

</body>

</html>
