<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Item Detail</title>

  <!-- /Component -->
  <link rel="stylesheet" href="../components/view/css/var.css" />
  <link rel="stylesheet" href="../components/view/css/header-footer.css" />
  <script src="../components/controller/components.js" defer></script>
  <script src="../components/controller/component-loader.js" defer></script>
  <!-- Component/ -->

  <link rel="stylesheet" href="../c-styles/global-styles.css" />
  <link rel="stylesheet" href="../c-styles/customer-itemdetail.css" />
  <link rel="stylesheet" href="../components/view/css/var.css" />
  <script src="../c-js/services/ProductData.js" defer></script>
  <script src="../c-js/c-pages/itemdetail-main.js" defer></script>
</head>

<body>
  <div id="header-placeholder" data-user-type="customer"></div>

  <!-- Main Content -->
  <main>
    <div class="container">
      <h2 class="items-detail-title">ITEM'S DETAIL</h2>

      <div class="detail-layout">
        <!-- Left: Images -->
        <div class="detail-images">
          <!--  -->
        </div>

        <!-- Right: Details -->
        <div class="detail-info">
          <div class="item-header">
            <div class="item-name"></div>
            <div class="item-brand"></div>
            <div class="item-price"></div>
          </div>

          <p class="item-description"></p>

          <div class="detail-section selectable">
            <h3>Color</h3>
            <div class="tag-group color-group">
              <!--  -->
            </div>
          </div>

          <div class="detail-section selectable">
            <h3>Size</h3>
            <div class="tag-group size-group">
              <!--  -->
            </div>
          </div>

          <div class="detail-section show" data-dropdown>
            <h3 onclick="toggleDropdown(this)">
              Size Fit
              <span class="dropdown-arrow">
                <img src="../assets/icon/Icon_dropdown.svg" alt="dropdown">
              </span>
            </h3>
            <div class="tag-group fit-group">
              <!--  -->
            </div>
          </div>

          <div class="detail-section show" data-dropdown>
            <h3 onclick="toggleDropdown(this)">
              Recommend season
              <span class="dropdown-arrow">
                <img src="../assets/icon/Icon_dropdown.svg" alt="dropdown">
              </span>
            </h3>
            <div class="tag-group season-group">
              <!--  -->
            </div>
          </div>

          <div class="detail-section show" data-dropdown>
            <h3 onclick="toggleDropdown(this)">
              Material
              <span class="dropdown-arrow">
                <img src="../assets/icon/Icon_dropdown.svg" alt="dropdown">
              </span>
            </h3>
            <div class="tag-group material-group">
              <!--  -->
            </div>
          </div>

          <div class="detail-section show" data-dropdown>
            <h3 onclick="toggleDropdown(this)">
              Texture
              <span class="dropdown-arrow">
                <img src="../assets/icon/Icon_dropdown.svg" alt="dropdown">
              </span>
            </h3>
            <div class="tag-group texture-group">
              <!--  -->
            </div>
          </div>

          <div class="detail-section show" data-dropdown>
            <h3 onclick="toggleDropdown(this)">
              Style
              <span class="dropdown-arrow">
                <img src="../assets/icon/Icon_dropdown.svg" alt="dropdown">
              </span>
            </h3>
            <div class="tag-group style-group">
              <!--  -->
            </div>
          </div>

          <div class="detail-section">
            <h3>Size Chart</h3>
            <div class="size-chart">
              <img src="../assets/SizeChart.png" alt="Size Chart" />
            </div>
          </div>
        </div>
      </div>

      <div class="action-buttons">
        <button class="chat-button primary">CHAT WITH OWNER</button>
        <button class="cart-button">
          <img src="../assets/icon/Icon_cart.svg" alt="Cart" />
        </button>
      </div>
    </div>
  </main>

  <div id="footer-placeholder" data-user-type="customer"></div>
</body>

</html>
