<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Style Shuffle | Delete Account</title>

    <!-- Component -->
    <link rel="stylesheet" href="../components/view/css/var.css" />
    <link rel="stylesheet" href="../components/view/css/header-footer.css" />
    <script src="../components/controller/components.js" defer></script>
    <script src="../components/controller/component-loader.js" defer></script>

    <!-- Component/ -->
    <link rel="stylesheet" href="../../c-styles/global-styles.css" />
    <link rel="stylesheet" href="../../components/view/css/var.css" />

    <!-- Page Specific Style -->
    <style>
      .delete-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 5rem 2rem;
        color: var(--deep-teal-blue);
        text-align: center;
      }

      .delete-icon {
        width: 100px;
        height: 100px;
        margin-bottom: 3rem;
        object-fit: contain;
      }

      .delete-content {
        max-width: 600px;
        background: var(--gray-100);
        border-radius: 4px;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .delete-section h2 {
        font-size: 1rem;
        color: var(--gray-400);
        margin-bottom: 2rem;
      }

      .delete-content p {
        font-size: 1rem;
        line-height: 1.6;
        margin-bottom: 3rem;
      }

      .delete-buttons {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        width: 100%;
        max-width: 320px;
      }

      .delete-confirm {
        background-color: var(--deep-teal-blue);
        color: white;
        font-size: 1rem;
        letter-spacing: 0.5px;
        border: none;
        padding: 0.9rem 0;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .delete-confirm:hover {
        background-color: var(--error-dark);
      }

      .delete-cancel {
        background-color: transparent;
        border: 1px solid var(--deep-teal-blue);
        color: var(--deep-teal-blue);
        font-size: 1rem;
        letter-spacing: 0.5px;
        padding: 1rem 0;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .delete-cancel:hover {
        background-color: var(--gray-300);
      }

      /* Message Popup */
      .message-popup-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.45);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1500;
      }

      .message-popup-overlay.active {
        display: flex;
      }

      .message-popup-box {
        background: white;
        padding: 2rem;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
        max-width: 400px;
        width: 90%;
        color: var(--deep-teal-blue);
      }

      .message-popup-box h3 {
        margin-bottom: 1.2rem;
        color: var(--deep-teal-blue);
        font-size: 1rem;
        line-height: 1.5;
      }

      .message-popup-box input {
        width: 80%;
        padding: 0.5rem;
        margin: 0.5rem 0 1rem;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      .message-popup-box button {
        background: var(--deep-teal-blue);
        color: white;
        border: none;
        padding: 0.6rem 1.5rem;
        border-radius: 8px;
        cursor: pointer;
      }

      .message-popup-box button.cancel {
        background: #ccc;
        color: #333;
      }

      @media (max-width: 1024px) {
        .back-arrow,
        .back-btn {
          position: absolute;
          top: 6rem;
          left: 1rem;
          z-index: 10;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <div class="delete-section">
        <h2>DELETE ACCOUNT</h2>

        <div class="delete-content">
          <img
            src="https://cdn-icons-png.flaticon.com/512/1345/1345823.png"
            alt="Delete Icon"
            class="delete-icon"
          />

          <p>
            Deleting your account is <strong>permanent</strong> and cannot be
            undone.<br />
            All your data, including your profile and saved information, will be
            deleted.<br />
            Are you sure you want to proceed?
          </p>

          <div class="delete-buttons">
            <button class="delete-confirm">DELETE</button>
            <button class="delete-cancel">CANCEL</button>
          </div>
        </div>
      </div>

      <!-- Message Popup -->
      <div id="successPopup" class="message-popup-overlay">
        <div class="message-popup-box">
          <h3 id="popupMessage">Message text</h3>
          <button id="popupCloseBtn">OK</button>
        </div>
      </div>
    </main>

    <script type="module" src="../../c-js/c-pages/delete.js"></script>
  </body>
</html>
