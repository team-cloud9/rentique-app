<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Style Shuffle</title>

    <!-- /Component -->
    <link rel="stylesheet" href="../components/view/css/var.css" />
    <link rel="stylesheet" href="../components/view/css/header-footer.css" />
    <script src="../components/controller/components.js" defer></script>
    <script src="../components/controller/component-loader.js" defer></script>

    <!-- Component/ -->

    <link rel="stylesheet" href="../../c-styles/global-styles.css" />
    <link rel="stylesheet" href="../../components/view/css/var.css" />

    <!-- JS Logic -->
    <script type="module" src="../../c-js/c-pages/preference.js"></script>

    <!-- Page Specific Style -->
    <style>
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        padding-top: 2rem;
      }

      h2 {
        font-size: 1rem;
        margin-bottom: 2rem;
        color: var(--deep-teal-blue);
      }

      .form-section {
        display: flex;
        align-items: flex-start;
        gap: 2rem;
        position: relative;
      }

      .pref-form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        width: 350px;
      }

      input {
        border: none;
        border-bottom: 1px solid var(--gray-400);
        padding: 0.6rem 0;
        font-size: 1rem;
        width: 100%;
        background: transparent;
      }

      input:focus {
        outline: none;
        border-color: var(--deep-teal-blue);
      }

      .pref-btn {
        background-color: white;
        border: 1px solid var(--deep-teal-blue);
        color: var(--deep-teal-blue);
        padding: 0.6rem;
        text-align: left;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .pref-btn:hover {
        background-color: var(--nyanza-100);
      }

      .save-btn {
        background-color: var(--deep-teal-blue);
        color: white;
        border: none;
        padding: 0.8rem;
        font-size: 1rem;
        cursor: pointer;
        margin-top: 1rem;
        transition: all 0.3s ease;
      }

      /* Popup overlay */
      .popup-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.45);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }

      /* Popup box */
      .popup-content {
        background: #fff;
        padding: 2rem;
        border-radius: 12px;
        width: 90%;
        max-width: 420px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }

      .popup-content h3 {
        text-align: center;
        margin-bottom: 1.5rem;
        color: var(--deep-teal-blue);
      }

      /* Grid layout for color/style buttons */
      .options-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
        margin-bottom: 1rem;
      }

      /* Option item button */
      .option-item {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1.8px solid #cfd8dc;
        border-radius: 50px;
        padding: 6px 14px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        background-color: white;
        transition: all 0.25s ease;
        position: relative;
      }

      /* Dot before text */
      .option-item::before {
        content: "";
        display: inline-block;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 1px solid #999;
        background-color: transparent;
      }

      .option-item.color::before {
        content: "";
        display: inline-block;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 1px solid #999;
        background-color: transparent;
      }

      .option-item.style::before {
        display: none;
      }

      /* Active (selected) */
      .option-item.active {
        border-color: var(--deep-teal-blue);
        background-color: #e6f4f1;
        color: var(--deep-teal-blue);
        font-weight: 600;
      }

      /* Hover */
      .option-item:hover {
        border-color: var(--deep-teal-blue);
        background-color: #f5faff;
      }

      /* === Color Dots === */
      .option-item.black::before {
        background: black;
      }

      .option-item.white::before {
        background: white;
        border: 1px solid #ccc;
      }

      .option-item.grey::before {
        background: #9e9e9e;
      }

      .option-item.beige::before {
        background: #f3e2c7;
      }

      .option-item.brown::before {
        background: #7b4b2a;
      }

      .option-item.navy::before {
        background: #0d47a1;
      }

      .option-item.red::before {
        background: #d32f2f;
      }

      .option-item.pink::before {
        background: #f48fb1;
      }

      .option-item.orange::before {
        background: #ffa726;
      }

      .option-item.yellow::before {
        background: #ffeb3b;
      }

      .option-item.green::before {
        background: #4caf50;
      }

      .option-item.blue::before {
        background: #2196f3;
      }

      .option-item.purple::before {
        background: #8e24aa;
      }

      /* === Popup buttons === */
      .popup-actions {
        display: flex;
        justify-content: space-around;
        margin-top: 1rem;
      }

      .popup-actions button {
        padding: 0.6rem 1.4rem;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        font-weight: 500;
      }

      .popup-save {
        background-color: var(--deep-teal-blue);
        color: white;
      }

      .popup-cancel {
        background-color: #ccc;
        color: var(--deep-teal-blue);
      }

      /* ================================
         Message Popup (Success/Fail)
      ================================== */
      .message-popup-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.45);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1500;
      }

      .message-popup-overlay.active {
        display: flex;
      }

      .message-popup-box {
        background: white;
        padding: 2rem;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
        max-width: 400px;
        width: 90%;
      }

      .message-popup-box h3 {
        margin-bottom: 1.2rem;
        color: var(--deep-teal-blue);
      }

      .message-popup-box button {
        background: var(--deep-teal-blue);
        color: white;
        border: none;
        padding: 0.6rem 1.5rem;
        border-radius: 8px;
        cursor: pointer;
      }

      @media (max-width: 1024px) {
        .back-arrow,
        .back-btn {
          position: absolute;
          top: 6rem;
          left: 1rem;
          z-index: 10;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <h2>Would you like to update your preferences?</h2>

      <div class="form-section">
        <!-- LEFT FORM -->
        <form class="pref-form">
          <input type="text" placeholder="Height (cm)" />
          <input type="text" placeholder="Weight (kg)" />
          <input type="text" placeholder="Gender (Male/Female/Other)" />

          <button type="button" class="pref-btn" data-popup="style">
            Your favorite style
          </button>
          <button type="button" class="pref-btn" data-popup="color">
            Your favorite color
          </button>
          <button type="button" class="pref-btn" data-popup="try">
            What style do you want to try?
          </button>

          <button type="submit" class="save-btn">SAVE</button>
        </form>
      </div>

      <!-- Message Popup -->
      <div id="successPopup" class="message-popup-overlay">
        <div class="message-popup-box">
          <h3 id="popupMessage">Profile updated successfully!</h3>
          <button id="popupCloseBtn">OK</button>
        </div>
      </div>
    </main>
  </body>
</html>
