<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rentique - Success</title>

    <!-- PWA + Theme -->
    <meta name="theme-color" content="#06324f" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/assets/logos/rentique-sub.png" />

    <!-- CSS -->
    <link rel="stylesheet" href="../c-styles/customer-auth.css" />
  </head>

  <body>
    <div class="container success-container">
      <div class="success-content">
        <!-- Logo -->
        <img
          src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/logo-4eh45c3WUpYmwPpP2HPt2jStjtt4Gt.png"
          alt="Rentique logo"
          class="logo-large"
        />

        <h1>RENTIQUE</h1>
        <h2>Welcome to Rentique!</h2>
        <p>Your account has been created successfully.</p>

        <a href="#" id="getStartedBtn" class="btn dark">GET STARTED</a>
        <script type="module">
          import {
            auth,
            firestore,
          } from "../../c-js/services/firebase-init.js";
          import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-auth.js";
          import {
            getDoc,
            doc,
          } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore.js";

          document
            .getElementById("getStartedBtn")
            .addEventListener("click", async (e) => {
              e.preventDefault();

              onAuthStateChanged(auth, async (user) => {
                if (user) {
                  // Firestore에서 사용자 데이터 가져오기
                  const snap = await getDoc(
                    doc(firestore, "customers", user.uid)
                  );
                  if (snap.exists()) {
                    localStorage.setItem(
                      "userData",
                      JSON.stringify(snap.data())
                    );
                    console.log("✅ User data cached:", snap.data());
                    window.location.href = "./c-home.html"; // 이동
                  } else {
                    alert("User data not found in Firestore.");
                  }
                } else {
                  alert("Please log in again.");
                  window.location.href = "./auth-login-customer.html";
                }
              });
            });
        </script>
      </div>
    </div>
  </body>
</html>
